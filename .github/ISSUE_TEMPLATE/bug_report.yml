name: Bug report
description: Something ctt did, or didn't do, that it should have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't paste prompts, transcripts or paths you can't share.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command you ran and the sessions you had open (titles and repos, with anything private replaced).
      placeholder: |
        1. Two sessions open in api-proxy, one titled "Envoy staging"
        2. Run `ctt envoy staging`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: claude-term-tabs version
      description: The release tag, or `git rev-parse --short HEAD` in your checkout.
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options:
        - iTerm2
        - WezTerm
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS, Node and Claude Code versions
      placeholder: "macOS 15, Node 24.1, Claude Code 2.1"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Output of the same command with `--list --json`, your config.json, screenshots.
