name: Idea
description: Something ct could find, switch to, pause or resume for you.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want to do
      description: The situation, and what ct should do in it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you handle it today
      description: Another tool, a script of your own, or by hand.
