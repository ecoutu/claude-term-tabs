name: CI

on:
  pull_request:
  # No push trigger: on every push to main, Release runs this workflow as its `ci` job before releasing.
  workflow_call:

permissions:
  contents: read

jobs:
  # `ci` is the required status check in the protect-main ruleset; keep the job name.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: install
        # Install scripts don't run, as in release.yml, so CI catches a dependency that needs one.
        run: npm ci --ignore-scripts
      - run: npm run check
      # Run the tests even when the type-check fails, so one CI run reports both; not when the install failed.
      - run: npm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # Packs, installs and runs the npm package; kept out of `npm test` because it takes seconds.
      - run: npm run test:package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
