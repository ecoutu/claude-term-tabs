name: CI

on:
  pull_request:
  # No push trigger: on every push to main, Release runs this workflow as its `ci` job before releasing.
  workflow_call:

permissions:
  contents: read

jobs:
  # `ci` is the required status check in the protect-main ruleset; keep the job name.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
