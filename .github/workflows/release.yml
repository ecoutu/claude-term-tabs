name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time; never cancel a release that is mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    # The release commit carries [skip ci]; guard here too so it can never re-trigger a release.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm trusted publishing: npm trades this OIDC token for a publish token, and adds provenance. No NPM_TOKEN.
      id-token: write
    steps:
      # main is protected by the `protect-main` ruleset, so the CHANGELOG.md commit needs a token that may bypass it:
      # the owner's classic token PROJECT_TOKEN (the admin role bypasses protect-main with mode "always").
      - name: Check the release token
        env:
          TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::set the PROJECT_TOKEN secret"; exit 1; fi
      # No credentials stay in .git/config: semantic-release pushes through a URL it builds from GITHUB_TOKEN.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Install scripts don't run here (as in ci.yml), so no dependency can add code before the release step.
      - run: npm ci --ignore-scripts
      # Only this step gets the token, but semantic-release, its plugins and npm publish's prepack build (tsc) all run
      # here and could read it. GITHUB_TOKEN must stay the only token variable: semantic-release prefers GIT_CREDENTIALS
      # and GH_TOKEN for its push URL, and the release commit and tag push without the git hooks.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
